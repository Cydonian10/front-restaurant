<fieldset class="fieldset">
  <legend class="fieldset-legend text-xs font-semibold"><label [for]="inputId()">{{ label() }}</label></legend>
<div class="dropzone" [class.dragging]="dragging()" [class.disabled]="disabled()" (dragover)="drag($event)" (dragleave)="dragging.set(false)" (drop)="drop($event)">
  <span class="drop-icon" aria-hidden="true">↑</span>
  <div class="drop-content">
    <span class="drop-label">Selecciona un archivo</span>
    <p class="drop-hint">Arrastra un archivo aquí o selecciónalo desde tu equipo.</p>
    @if (hint()) { <p class="drop-hint">{{ hint() }}</p> }
    @if (selectedFile(); as file) { <p class="drop-file" role="status">{{ file.name }}</p> }
    <input [id]="inputId()" type="file" [accept]="accept()" [disabled]="disabled()" (change)="change($event)" />
  </div>
</div>

</fieldset>
